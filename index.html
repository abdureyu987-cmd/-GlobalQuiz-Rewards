<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Earn Pro</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --header-bg: #1f2937;
            --text-color: #fff;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --btn-bg: #374151;
            --btn-hover: #4b5563;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        html, body {
            height: 100%;
            width: 100%;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
        }
        
        .app-container {
            width: 100%;
            max-width: 410px;
            height: 100%;
            max-height: 100vh;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        @media(min-width: 450px) {
            .app-container { border-radius: 24px; border: 3px solid var(--border-color); height: 92vh; max-height: 800px; }
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .app-title { font-size: 16px; font-weight: 800; color: #3b82f6; }
        .menu-btn { background: none; border: none; color: var(--text-color); font-size: 22px; cursor: pointer; }

        .app-body {
            flex: 1;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .stats-card {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            color: #fff;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }
        .stats-card p { font-size: 11px; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }
        .stats-card h2 { font-size: 28px; margin-top: 4px; font-weight: 800; }

        .ad-box {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--header-bg);
            padding: 6px;
            border-radius: 10px;
            border: 1px dashed var(--border-color);
            overflow: hidden;
            text-align: center;
            min-height: 50px;
        }

        .quiz-box {
            background: var(--header-bg);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }
        .q-info-banner { font-size: 12px; color: #38bdf8; font-weight: 600; margin-bottom: 6px; }
        .q-text { font-size: 14px; font-weight: 700; margin-bottom: 12px; line-height: 1.4; color: var(--text-color); }
        
        .options-list { display: flex; flex-direction: column; gap: 8px; }
        .option-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--text-color);
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .option-btn:hover { background: var(--btn-hover); border-color: #3b82f6; }
        .option-btn.correct { background: #059669 !important; color: #fff !important; }
        .option-btn.wrong { background: #dc2626 !important; color: #fff !important; }

        .action-row { display: flex; flex-direction: column; gap: 8px; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
        }
        .btn-ads { background: #f59e0b; color: #fff; }
        .btn-tg { background: #0284c7; color: #fff; }
        .btn-withdraw { background: #10b981; color: #fff; }

        /* Settings Drawer (ቋንቋ ብቻ) */
        .drawer {
            position: absolute;
            top: 0; right: -100%;
            width: 75%; height: 100%;
            background: var(--card-bg);
            z-index: 100;
            transition: 0.3s ease-in-out;
            padding: 18px;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-left: 1px solid var(--border-color);
        }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .drawer-header h3 { color: var(--text-color); font-size: 16px; }
        .close-drawer { background: none; border: none; color: var(--text-color); font-size: 20px; cursor: pointer; }
        
        .setting-group { display: flex; flex-direction: column; gap: 6px; }
        .setting-group label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .setting-group select {
            background: var(--header-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 10px; border-radius: 10px; outline: none; font-size: 13px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="app-header">
        <div class="app-title" id="appTitle">Smart Earn Pro</div>
        <button class="menu-btn" onclick="toggleDrawer()">☰</button>
    </header>

    <!-- Main Content -->
    <div class="app-body">
        <div class="stats-card">
            <p id="balLabel">Total Balance</p>
            <h2 id="balanceText">$0.00</h2>
        </div>

        <!-- Adsterra Banner -->
        <div class="ad-box">
            <script type="text/javascript">
                atOptions = { 'key' : '3b79b1600f4dce57954711090d5df308', 'format' : 'iframe', 'height' : 60, 'width' : 468, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://sneakinghalfbakedcucumber.com/3b79b1600f4dce57954711090d5df308/invoke.js"></script>
        </div>

        <div class="quiz-box">
            <div class="q-info-banner" id="qInfoBanner">💎 Answer correct & earn $0.10</div>
            <div class="q-text" id="questionText">Loading quiz...</div>
            <div class="options-list" id="optionsList"></div>
        </div>

        <div class="action-row">
            <button class="btn btn-ads" onclick="watchAdsTask()" id="adsBtn">Watch 20 Ads & Earn $5.00 (0/20)</button>
            <button class="btn btn-tg" onclick="subscribeTelegram()" id="tgBtn">Join Telegram (+$0.1)</button>
            <button class="btn btn-withdraw" onclick="withdrawMoney()" id="wdBtn">Withdraw ($100 Min)</button>
        </div>
    </div>

    <!-- Settings Drawer (Language Only) -->
    <div class="drawer" id="settingsDrawer">
        <div class="drawer-header">
            <h3 id="settingsTitle">Settings</h3>
            <button class="close-drawer" onclick="toggleDrawer()">✕</button>
        </div>
        
        <div class="setting-group">
            <label id="langLabel">Select Language</label>
            <select id="langSelect" onchange="changeLanguage()">
                <option value="en">English (Default)</option>
                <option value="ar">العربية (Arabic)</option>
                <option value="zh">中文 (Chinese)</option>
                <option value="fr">Français (French)</option>
                <option value="es">Español (Spanish)</option>
            </select>
        </div>
    </div>
</div>

<!-- Adsterra Social Bar -->
<script type="text/javascript" src="https://sneakinghalfbakedcucumber.com/0d/61/12/0d611270737c19cfba639f6c680670fe.js"></script>

<script>
    let balance = 0.00;
    let currentQIndex = 0;
    let hasSubscribedTelegram = false;
    let watchedAdsCount = 0;
    const tgLink = "https://t.me/SMARtTrader0r";

    const questions = [
        { q: "What is the capital city of France?", options: ["London", "Berlin", "Paris", "Madrid"], answer: 2 },
        { q: "Which programming language powers interactive web browsers?", options: ["Python", "JavaScript", "C++", "Java"], answer: 1 },
        { q: "What is 50 + 50 multiplied by 0?", options: ["100", "0", "50", "10"], answer: 1 },
        { q: "Which global company created the iPhone series?", options: ["Microsoft", "Google", "Apple", "Samsung"], answer: 2 },
        { q: "What is the largest planet in our solar system?", options: ["Earth", "Mars", "Jupiter", "Venus"], answer: 2 }
    ];

    const i18n = {
        en: { title: "Smart Earn Pro", bal: "Total Balance", tg: "Join Telegram (+$0.1)", wd: "Withdraw ($100 Min)", set: "Settings", lang: "Select Language", banner: "💎 Answer correct & earn $0.10" },
        ar: { title: "سمارت إرن برو", bal: "الرصيد الإجمالي", tg: "انضم للتليجرام (+$0.1)", wd: "سحب ($100 الحد الأدنى)", set: "الإعدادات", lang: "اختر اللغة", banner: "💎 أجب واكسب 0.10$" },
        zh: { title: "智能赚钱专业版", bal: "总余额", tg: "加入电报 (+$0.1)", wd: "提现 ($100)", set: "设置", lang: "选择语言", banner: "💎 回答正确赚取 $0.10" },
        fr: { title: "Smart Earn Pro", bal: "Solde Total", tg: "Rejoindre Telegram (+$0.1)", wd: "Retirer ($100)", set: "Paramètres", lang: "Choisir la langue", banner: "💎 Répondez et gagnez 0.10$" },
        es: { title: "Smart Earn Pro", bal: "Saldo Total", tg: "Unirse a Telegram (+$0.1)", wd: "Retirar ($100)", set: "Ajustes", lang: "Seleccionar Idioma", banner: "💎 Gana $0.10" }
    };

    function loadQuestion() {
        const lang = document.getElementById("langSelect").value;
        const t = i18n[lang];
        const current = questions[currentQIndex];

        document.getElementById("qInfoBanner").innerText = t.banner;
        document.getElementById("questionText").innerText = current.q;

        const optionsList = document.getElementById("optionsList");
        optionsList.innerHTML = "";

        current.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, idx, current.answer);
            optionsList.appendChild(btn);
        });
    }

    function checkAnswer(btnElement, selected, correct) {
        const optionsList = document.getElementById("optionsList");
        const allButtons = optionsList.getElementsByTagName("button");

        for (let btn of allButtons) { btn.disabled = true; }

        if (selected === correct) {
            btnElement.classList.add("correct");
            balance += 0.10;
            updateBalance();
        } else {
            btnElement.classList.add("wrong");
            allButtons[correct].classList.add("correct");
        }

        setTimeout(() => {
            currentQIndex = (currentQIndex + 1) % questions.length;
            loadQuestion();
        }, 800);
    }

    function updateBalance() {
        document.getElementById("balanceText").innerText = "$" + balance.toFixed(2);
    }

    function watchAdsTask() {
        if (watchedAdsCount < 20) {
            watchedAdsCount++;
            window.open("https://sneakinghalfbakedcucumber.com/0d/61/12/0d611270737c19cfba639f6c680670fe.js", '_blank');
            
            if (watchedAdsCount < 20) {
                document.getElementById("adsBtn").innerText = `Watch Next Ad (${watchedAdsCount}/20)`;
            } else {
                balance += 5.00;
                updateBalance();
                document.getElementById("adsBtn").innerText = `Completed! ($5.00 Claimed)`;
                document.getElementById("adsBtn").disabled = true;
                document.getElementById("adsBtn").style.background = "#059669";
            }
        }
    }

    function toggleDrawer() {
        document.getElementById("settingsDrawer").classList.toggle("open");
    }

    function changeLanguage() {
        const lang = document.getElementById("langSelect").value;
        const t = i18n[lang];

        document.getElementById("appTitle").innerText = t.title;
        document.getElementById("balLabel").innerText = t.bal;
        if (watchedAdsCount < 20) {
            document.getElementById("adsBtn").innerText = `Watch 20 Ads & Earn $5.00 (${watchedAdsCount}/20)`;
        }
        document.getElementById("tgBtn").innerText = t.tg;
        document.getElementById("wdBtn").innerText = t.wd;
        document.getElementById("settingsTitle").innerText = t.set;
        document.getElementById("langLabel").innerText = t.lang;

        loadQuestion();
    }

    function subscribeTelegram() {
        window.open(tgLink, '_blank');
        if (!hasSubscribedTelegram) {
            hasSubscribedTelegram = true;
            balance += 0.10;
            updateBalance();
        }
    }

    function withdrawMoney() {
        if (balance < 100.00) {
            alert("⚠️ Minimum withdrawal is $100.00");
        } else {
            alert("🎉 Withdrawal request submitted!");
        }
    }

    loadQuestion();
</script>

</body>
</html>
